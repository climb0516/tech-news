<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <title>TechPulse · AI & 技术动态</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #08080c;
      --bg-2: #0e0e14;
      --panel: rgba(22,22,30,0.72);
      --panel-solid: #14141b;
      --hover: rgba(255,255,255,0.04);
      --line: rgba(255,255,255,0.07);
      --line-2: rgba(255,255,255,0.12);
      --text-1: #ededf2;
      --text-2: #a0a0b0;
      --text-3: #64647a;
      --accent: #8b7cff;
      --accent-2: #4cc9f0;
      --grad: linear-gradient(120deg, #8b7cff 0%, #4cc9f0 100%);
      --grid-dot: rgba(255,255,255,0.045);
      --glow-1: rgba(139,124,255,0.18);
      --glow-2: rgba(76,201,240,0.10);
      --cat-A: #a78bfa;
      --cat-B: #22d3ee;
      --cat-C: #34d399;
      --cat-D: #fbbf24;
      --cat-E: #fb7185;
      --shadow: 0 0 0 1px var(--line), 0 12px 32px rgba(0,0,0,0.35);
      --kbd-bg: rgba(255,255,255,0.06);
    }
    :root[data-theme="light"] {
      --bg: #fafafb;
      --bg-2: #ffffff;
      --panel: rgba(255,255,255,0.8);
      --panel-solid: #ffffff;
      --hover: rgba(10,10,30,0.035);
      --line: rgba(10,10,30,0.08);
      --line-2: rgba(10,10,30,0.14);
      --text-1: #121218;
      --text-2: #565668;
      --text-3: #8e8ea2;
      --accent: #6a55f5;
      --accent-2: #0ea5c6;
      --grad: linear-gradient(120deg, #6a55f5 0%, #0ea5c6 100%);
      --grid-dot: rgba(10,10,30,0.06);
      --glow-1: rgba(106,85,245,0.10);
      --glow-2: rgba(14,165,198,0.07);
      --cat-A: #7c3aed;
      --cat-B: #0891b2;
      --cat-C: #059669;
      --cat-D: #b45309;
      --cat-E: #e11d48;
      --shadow: 0 0 0 1px var(--line), 0 10px 28px rgba(20,20,60,0.07);
      --kbd-bg: rgba(10,10,30,0.05);
    }

    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text-1);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      font-size: 14px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background:
        radial-gradient(600px 400px at 15% -5%, var(--glow-1), transparent 70%),
        radial-gradient(700px 500px at 95% 0%, var(--glow-2), transparent 70%),
        radial-gradient(circle, var(--grid-dot) 1px, transparent 1px) 0 0 / 22px 22px;
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; color: inherit; }

    /* ── Top bar ── */
    .topbar {
      position: sticky; top: 0; z-index: 30;
      background: color-mix(in srgb, var(--bg) 72%, transparent);
      backdrop-filter: saturate(180%) blur(18px);
      -webkit-backdrop-filter: saturate(180%) blur(18px);
      border-bottom: 1px solid var(--line);
    }
    .topbar-inner {
      max-width: 1320px; margin: 0 auto; padding: 0 24px;
      height: 60px; display: flex; align-items: center; gap: 20px;
    }
    .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 17px; letter-spacing: -0.02em; white-space: nowrap; }
    .logo-mark {
      width: 28px; height: 28px; border-radius: 8px;
      background: var(--grad);
      display: grid; place-items: center;
      color: #fff; font-size: 15px;
      box-shadow: 0 0 20px var(--glow-1);
    }
    .logo small { font-weight: 500; font-size: 12px; color: var(--text-3); letter-spacing: 0; }
    .search {
      flex: 1; max-width: 520px; margin: 0 auto;
      display: flex; align-items: center; gap: 8px;
      background: var(--panel); border: 1px solid var(--line);
      border-radius: 10px; padding: 0 10px; height: 36px;
      transition: border-color .15s, box-shadow .15s;
    }
    .search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--glow-1); }
    .search svg { color: var(--text-3); flex: none; }
    .search input {
      flex: 1; min-width: 0; background: none; border: none; outline: none;
      color: var(--text-1); font: inherit; font-size: 13.5px;
    }
    .search input::placeholder { color: var(--text-3); }
    kbd {
      font-family: inherit; font-size: 11px; color: var(--text-3);
      background: var(--kbd-bg); border: 1px solid var(--line);
      border-radius: 5px; padding: 1px 6px;
    }
    .top-right { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
    .updated { font-size: 12px; color: var(--text-3); display: flex; align-items: center; gap: 6px; }
    .live-dot { width: 7px; height: 7px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 0 3px rgba(34,197,94,0.2); animation: pulse 2s infinite; }
    @keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(34,197,94,0); } }
    .icon-btn {
      width: 34px; height: 34px; border-radius: 9px;
      background: var(--panel); border: 1px solid var(--line);
      cursor: pointer; display: grid; place-items: center; color: var(--text-2);
    }
    .icon-btn:hover { color: var(--text-1); border-color: var(--line-2); }
    a.icon-btn { text-decoration: none; }
    .icon-btn:disabled { cursor: default; opacity: 0.6; }
    .icon-btn.spinning svg { animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Layout ── */
    .layout {
      max-width: 1320px; margin: 0 auto; padding: 24px 24px 64px;
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr) 300px;
      grid-template-areas: "side main rail";
      gap: 28px;
      align-items: start;
    }
    .side { grid-area: side; position: sticky; top: 84px; max-height: calc(100vh - 100px); overflow-y: auto; scrollbar-width: none; }
    .side::-webkit-scrollbar { display: none; }
    .main { grid-area: main; min-width: 0; }
    .rail { grid-area: rail; position: sticky; top: 84px; display: flex; flex-direction: column; gap: 16px; }

    /* ── Sidebar nav ── */
    .nav-title { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-3); padding: 0 10px 8px; }
    .nav-group + .nav-group { margin-top: 22px; }
    .nav-list { display: flex; flex-direction: column; gap: 1px; }
    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 7px 10px; border-radius: 8px;
      background: none; border: none; cursor: pointer; text-align: left;
      color: var(--text-2); font-size: 13.5px;
      transition: background .12s, color .12s;
    }
    .nav-item:hover { background: var(--hover); color: var(--text-1); }
    .nav-item.active { background: var(--hover); color: var(--text-1); font-weight: 600; box-shadow: inset 2px 0 0 var(--accent); }
    .nav-item .label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .nav-item .cnt { font-size: 11.5px; color: var(--text-3); font-variant-numeric: tabular-nums; }
    .cat-dot { width: 8px; height: 8px; border-radius: 3px; flex: none; }
    .nav-item .avatar { width: 20px; height: 20px; border-radius: 6px; font-size: 9px; }
    .nav-clear { font-size: 11.5px; color: var(--accent); background: none; border: none; cursor: pointer; float: right; text-transform: none; letter-spacing: 0; font-weight: 500; }

    /* ── Avatar（来源标识） ── */
    .avatar {
      flex: none; display: grid; place-items: center;
      width: 36px; height: 36px; border-radius: 10px;
      font-weight: 800; font-size: 12px; letter-spacing: -0.02em; color: #fff;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12);
    }

    /* ── Feed toolbar ── */
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    .toolbar h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.025em; }
    .toolbar h1 .grad { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .toolbar .sub { font-size: 12.5px; color: var(--text-3); margin-top: 2px; }
    .seg { display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 3px; gap: 2px; flex: none; }
    .seg button {
      border: none; background: none; cursor: pointer;
      padding: 4px 10px; border-radius: 6px; font-size: 12.5px; color: var(--text-3);
      display: flex; align-items: center; gap: 5px;
    }
    .seg button.active { background: var(--line-2); color: var(--text-1); }

    .chips { display: none; }

    /* ── Post（信息流单条） ── */
    .feed { display: flex; flex-direction: column; gap: 10px; }
    .post {
      display: flex; gap: 14px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px;
      position: relative;
      transition: border-color .15s, transform .15s, background .15s;
    }
    .post:hover { border-color: var(--line-2); background: color-mix(in srgb, var(--panel-solid) 92%, var(--accent)); }
    .post::after {
      content: ''; position: absolute; inset: -1px; border-radius: 15px; pointer-events: none;
      padding: 1px; background: var(--grad); opacity: 0; transition: opacity .2s;
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude;
    }
    .post:hover::after { opacity: 0.55; }
    .post-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
    .post-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12.5px; color: var(--text-3); }
    .post-meta .src { color: var(--text-1); font-weight: 600; }
    .post-meta .sep { opacity: .5; }
    .tag {
      font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 999px;
      border: 1px solid currentColor; line-height: 1.6;
      background: color-mix(in srgb, currentColor 10%, transparent);
    }
    .tag-ai { color: var(--accent); }
    .post-title { font-size: 15.5px; font-weight: 650; line-height: 1.45; letter-spacing: -0.01em; color: var(--text-1); }
    .post-summary {
      font-size: 13.5px; color: var(--text-2); line-height: 1.6;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .post-actions { display: flex; align-items: center; gap: 16px; font-size: 12px; color: var(--text-3); margin-top: 2px; }
    .post-actions .act { display: inline-flex; align-items: center; gap: 4px; position: relative; z-index: 1; background: none; border: none; cursor: pointer; color: inherit; }
    .post-actions .act:hover { color: var(--text-1); }
    .thumb {
      flex: none; width: 132px; height: 92px; border-radius: 10px; object-fit: cover;
      background: var(--line); border: 1px solid var(--line);
    }

    /* ── Grid view ── */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
    .gcard {
      display: flex; flex-direction: column;
      background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
      overflow: hidden; position: relative;
      transition: border-color .15s, transform .15s;
    }
    .gcard:hover { border-color: var(--line-2); transform: translateY(-2px); }
    .gcard img { width: 100%; height: 140px; object-fit: cover; display: block; border-bottom: 1px solid var(--line); }
    .gcard .in { padding: 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
    .gcard .post-title { font-size: 14.5px; }
    .gcard .post-summary { -webkit-line-clamp: 3; }
    .gcard .avatar { width: 22px; height: 22px; border-radius: 6px; font-size: 9px; }
    .section-label { font-size: 12px; font-weight: 600; color: var(--text-3); letter-spacing: .04em; margin: 4px 2px 10px; }
    .section-label.gap { margin-top: 26px; }

    /* ── Timeline view ── */
    .day { margin-bottom: 22px; }
    .day-head {
      display: flex; align-items: center; gap: 10px;
      font-size: 12.5px; font-weight: 700; color: var(--text-2); margin: 0 2px 8px;
    }
    .day-head::after { content: ''; flex: 1; height: 1px; background: var(--line); }
    .day-head .n { font-weight: 500; color: var(--text-3); }
    .rows { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
    .row {
      display: flex; align-items: center; gap: 12px;
      padding: 11px 14px; position: relative;
      transition: background .12s;
    }
    .row + .row { border-top: 1px solid var(--line); }
    .row:hover { background: var(--hover); }
    .row .avatar { width: 26px; height: 26px; border-radius: 7px; font-size: 9.5px; }
    .row-main { flex: 1; min-width: 0; }
    .row-title { font-size: 14px; font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row-sub { font-size: 12px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row .tag { flex: none; }

    .more {
      display: block; width: 100%; margin-top: 14px; padding: 10px;
      background: var(--panel); border: 1px dashed var(--line-2); border-radius: 12px;
      color: var(--text-2); cursor: pointer; font-size: 13px;
    }
    .more:hover { color: var(--text-1); border-color: var(--accent); }
    .empty { text-align: center; padding: 80px 0; color: var(--text-3); }
    .skeleton { height: 108px; border-radius: 14px; background: linear-gradient(90deg, var(--panel) 0%, var(--hover) 50%, var(--panel) 100%); background-size: 200% 100%; animation: shimmer 1.2s infinite; border: 1px solid var(--line); }
    @keyframes shimmer { to { background-position: -200% 0; } }

    /* ── Right rail widgets ── */
    .widget { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
    .widget-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 14px 8px; font-size: 13px; font-weight: 700;
    }
    .widget-head .hint { font-size: 11px; font-weight: 500; color: var(--text-3); display: flex; align-items: center; gap: 5px; }
    .hot { display: flex; align-items: flex-start; gap: 10px; padding: 7px 14px; position: relative; }
    .hot:hover { background: var(--hover); }
    .hot .rk { width: 18px; flex: none; font-size: 13px; font-weight: 800; color: var(--text-3); text-align: center; font-variant-numeric: tabular-nums; }
    .hot .rk.r1 { color: #f43f5e; } .hot .rk.r2 { color: #f97316; } .hot .rk.r3 { color: #eab308; }
    .hot .t { flex: 1; min-width: 0; font-size: 13px; line-height: 1.45; color: var(--text-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .hot:hover .t { color: var(--text-1); }
    .hot .pts { font-size: 11px; color: var(--text-3); white-space: nowrap; font-variant-numeric: tabular-nums; }
    .widget-foot { height: 8px; }
    .bars { padding: 4px 14px 14px; display: flex; flex-direction: column; gap: 7px; }
    .bar { display: grid; grid-template-columns: 64px 1fr 28px; align-items: center; gap: 8px; font-size: 12px; color: var(--text-2); }
    .bar .track { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
    .bar .fill { height: 100%; border-radius: 3px; background: var(--grad); }
    .bar .v { text-align: right; color: var(--text-3); font-variant-numeric: tabular-nums; }
    .bar .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    footer { text-align: center; font-size: 12px; color: var(--text-3); padding: 0 0 40px; }
    footer b { color: var(--text-2); font-weight: 600; }

    /* ── 中屏：右栏并入左栏下方 ── */
    @media (max-width: 1180px) {
      .layout { grid-template-columns: 220px minmax(0, 1fr); grid-template-areas: "side main" "rail main"; }
      .rail { position: static; }
      .side { position: static; max-height: none; }
    }
    /* ── 手机：单栏 + 横向标签 ── */
    @media (max-width: 820px) {
      .topbar-inner { padding: 0 16px; gap: 10px; }
      .logo small, .updated, .search kbd { display: none; }
      .search { height: 34px; min-width: 0; }
      .toolbar { flex-direction: column; align-items: flex-start; gap: 10px; }
      .layout { grid-template-columns: minmax(0, 1fr); grid-template-areas: "main" "rail"; padding: 16px 16px 48px; gap: 20px; }
      .side { display: none; }
      .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px 10px; padding: 0 16px; }
      .chips::-webkit-scrollbar { display: none; }
      .chip {
        flex: none; display: inline-flex; align-items: center; gap: 6px;
        padding: 5px 12px; border-radius: 999px; font-size: 12.5px;
        background: var(--panel); border: 1px solid var(--line); color: var(--text-2); cursor: pointer;
      }
      .chip.active { color: var(--text-1); border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
      .toolbar h1 { font-size: 19px; }
      .post { padding: 14px; gap: 12px; }
      .thumb { width: 92px; height: 70px; }
      .post-title { font-size: 15px; }
      .post-summary { -webkit-line-clamp: 2; }
      .row .tag { display: none; }
    }
    /* ── 详情抽屉 + 列表页（通用组件 kit：电脑右侧滑出，手机底部升起；地址 #/item/类型/id、#/list/key） ── */
    :root { --kit-bg: var(--bg, #0b0a10); --kit-panel: var(--panel, var(--card, rgba(255,255,255,.04))); --kit-line: var(--line, var(--sep, rgba(255,255,255,.08)));
      --kit-line2: var(--line-2, rgba(255,255,255,.14)); --kit-t1: var(--text-1, #f1eff7); --kit-t2: var(--text-2, #a39fb3); --kit-t3: var(--text-3, #6b677a);
      --kit-accent: var(--accent, #a3e635); --kit-hover: var(--hover, rgba(255,255,255,.05)); }
    .kit-mask { position: fixed; inset: 0; z-index: 90; background: rgba(0,0,0,.38); display: none; }
    .kit-mask.open { display: block; }
    .kit-sheet { position: absolute; top: 12px; right: 12px; bottom: 12px; width: clamp(440px, 42vw, 620px); max-width: calc(100vw - 24px);
      display: flex; flex-direction: column; overflow: hidden; color: var(--kit-t1); border-radius: 18px;
      background: linear-gradient(var(--kit-panel), var(--kit-panel)), var(--kit-bg); box-shadow: 0 0 0 1px var(--kit-line2), 0 24px 60px rgba(0,0,0,.45);
      animation: kit-in .24s ease-out; }
    @keyframes kit-in { from { transform: translateX(40px); opacity: 0; } }
    .kit-x { position: absolute; top: 12px; right: 12px; z-index: 3; width: 32px; height: 32px; border-radius: 50%; border: 0; cursor: pointer;
      background: rgba(0,0,0,.5); color: #fff; font-size: 15px; display: grid; place-items: center; }
    .kit-scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; }
    .kit-cover { aspect-ratio: 16/9; background: var(--kit-hover) center / cover no-repeat; position: relative; }
    .kit-cover.tall { aspect-ratio: auto; height: 280px; background-size: contain; background-color: #000; }
    .kit-cover.ph { display: grid; place-items: center; font-size: 56px; aspect-ratio: 16/6; }
    .kit-head { padding: 18px 20px 4px; display: flex; gap: 14px; align-items: flex-start; }
    .kit-head .kit-thumb { flex-shrink: 0; width: 64px; height: 64px; border-radius: 14px; background: var(--kit-hover) center / cover no-repeat;
      display: grid; place-items: center; font-size: 28px; overflow: hidden; }
    .kit-head .kit-t { flex: 1; min-width: 0; padding-right: 30px; }
    .kit-cover + .kit-head .kit-t { padding-right: 0; }
    .kit-head h2 { font-size: 19px; font-weight: 800; line-height: 1.35; letter-spacing: -0.01em; }
    .kit-sub { color: var(--kit-t2); font-size: 13px; margin-top: 4px; }
    .kit-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .kit-tags span { font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 6px; background: var(--kit-hover); color: var(--kit-t2); }
    .kit-big { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
    .kit-big b { font-size: 28px; font-weight: 800; letter-spacing: -0.02em; }
    .kit-body { padding: 4px 20px 20px; }
    .kit-sec { padding-top: 16px; }
    .kit-sec + .kit-sec { margin-top: 6px; border-top: 1px solid var(--kit-line); }
    .kit-sec h4 { font-size: 14.5px; font-weight: 700; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .kit-sec h4 small { font-size: 12px; color: var(--kit-t3); font-weight: 500; }
    .kit-kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
    .kit-kv div { background: var(--kit-hover); border-radius: 10px; padding: 8px 11px; min-width: 0; }
    .kit-kv small { display: block; font-size: 11px; color: var(--kit-t3); }
    .kit-kv b { display: block; font-size: 14px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; }
    .kit-p { font-size: 13.5px; line-height: 1.75; color: var(--kit-t2); white-space: pre-line; }
    .kit-rows { display: flex; flex-direction: column; }
    .kit-row { display: flex; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--kit-line); font-size: 13px; text-decoration: none; color: inherit; }
    .kit-row:first-child { border-top: 0; }
    .kit-row[data-kit-go], a.kit-row { cursor: pointer; }
    .kit-row[data-kit-go]:hover .kit-rt, a.kit-row:hover .kit-rt { color: var(--kit-accent); }
    .kit-row .kit-rt { flex: 1; min-width: 0; line-height: 1.45; }
    .kit-row .kit-rm { color: var(--kit-t3); font-size: 12px; white-space: nowrap; }
    .kit-row img, .kit-row .kit-ri { width: 54px; height: 40px; border-radius: 6px; object-fit: cover; flex-shrink: 0; background: var(--kit-hover); }
    .kit-acts { flex-shrink: 0; display: flex; gap: 10px; padding: 12px 20px 16px; border-top: 1px solid var(--kit-line); }
    .kit-acts a, .kit-acts button { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 11px 12px; border-radius: 11px;
      font: inherit; font-size: 13.5px; font-weight: 700; text-decoration: none; cursor: pointer; border: 1px solid var(--kit-line2); color: var(--kit-t1); background: transparent; }
    .kit-acts .pri { background: var(--kit-accent); border-color: var(--kit-accent); color: #111; }
    .kit-acts a:hover, .kit-acts button:hover { filter: brightness(1.08); }

    .kit-lhead { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    .kit-back { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--kit-line2); background: transparent; color: var(--kit-t1);
      font-size: 20px; cursor: pointer; display: grid; place-items: center; flex-shrink: 0; }
    .kit-back:hover { background: var(--kit-hover); }
    .kit-lhead h2 { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
    .kit-lhead small { color: var(--kit-t3); font-size: 12.5px; margin-left: 2px; }
    .kit-lbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
    .kit-chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
    .kit-chips a, .kit-chips button { padding: 5px 12px; border-radius: 8px; background: var(--kit-hover); color: var(--kit-t2); font: inherit; font-size: 13px;
      font-weight: 600; white-space: nowrap; border: 0; cursor: pointer; text-decoration: none; }
    .kit-chips .on { background: var(--kit-t1); color: var(--kit-bg); }
    .kit-chips small { opacity: .6; margin-left: 4px; font-weight: 500; }
    .kit-sel { padding: 6px 10px; border-radius: 9px; border: 1px solid var(--kit-line2); background: transparent; color: var(--kit-t1); font: inherit; font-size: 12.5px; font-weight: 600; }
    .kit-sel option { background: var(--kit-bg); }
    .kit-more { display: block; margin: 16px auto 0; padding: 9px 22px; border-radius: 10px; border: 1px solid var(--kit-line2); background: transparent;
      color: var(--kit-t1); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
    .kit-more:hover { background: var(--kit-hover); }
    .kit-morelink { font-size: 13px; font-weight: 600; color: var(--kit-t2); text-decoration: none; white-space: nowrap; cursor: pointer; }
    .kit-morelink:hover { color: var(--kit-t1); }
    [data-kit-item] { cursor: pointer; }
    @media (max-width: 760px) {
      .kit-sheet { top: auto; left: 0; right: 0; bottom: 0; width: 100%; max-width: none; height: 86vh; border-radius: 18px 18px 0 0; animation: kit-up .26s ease-out; }
      @keyframes kit-up { from { transform: translateY(30%); opacity: .5; } }
      .kit-head { padding: 16px 16px 4px; } .kit-body { padding: 4px 16px 18px; } .kit-acts { padding: 10px 16px 16px; }
      .kit-cover.tall { height: 220px; }
      .kit-head .kit-thumb { width: 46px; height: 46px; border-radius: 12px; font-size: 22px; }
      .kit-head h2 { font-size: 17.5px; }

    /* 可点开详情的元素 */
    .post[data-kit-item], .gcard[data-kit-item], .row[data-kit-item], a.hot { cursor: pointer; }
    .post-meta .pts { color: var(--text-2); font-variant-numeric: tabular-nums; }
    .widget-more { display: block; padding: 6px 14px 12px; }

  </style>

<script>
// ── kit：详情抽屉 + 列表页路由（各站通用，内联在页面里）──
// 用法：
//   KIT.item('news', id => ({ title, sub, cover, thumb, tags:[], big, body:'<div class="kit-sec">…</div>', acts:[{text, href, pri}] }))
//   KIT.list('news', (param, query) => { … 把列表页 HTML 写进容器 … })
//   条目元素加 data-kit-item="news/<id>" 即可点击打开详情；「查看更多」写成 <a href="#/list/news">
//   站点首页渲染函数里先调用 KIT.route() —— 返回 true 表示当前是列表页（已渲染），首页不用再渲染
const KIT = (() => {
  const items = {}, lists = {};
  let mask, homeY = 0, fromHome = 0, lastHash = location.hash, onHome = null, listBox = null;
  const kesc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const parse = h => {
    const m = (h === undefined ? location.hash : h).match(/^#\/(item|list)\/([^?]+?)(?:\?(.*))?$/);
    if (!m) return null;
    const [type, ...rest] = m[2].split('/');
    return { kind: m[1], type: decodeURIComponent(type), id: rest.map(decodeURIComponent).join('/'), q: new URLSearchParams(m[3] || '') };
  };
  function ensure() {
    if (mask) return;
    mask = document.createElement('div');
    mask.className = 'kit-mask';
    mask.innerHTML = '<div class="kit-sheet" role="dialog" aria-modal="true"></div>';
    document.body.appendChild(mask);
    mask.addEventListener('click', e => { if (e.target === mask || e.target.closest('[data-kit-close]')) close(); });
  }
  function render(d) {
    ensure();
    const cover = d.cover ? `<div class="kit-cover ${d.coverTall ? 'tall' : ''}" style="background-image:url('${kesc(d.cover).replace(/'/g, '%27')}')"></div>`
      : d.coverIcon ? `<div class="kit-cover ph" style="background:${d.coverBg || 'var(--kit-hover)'}">${d.coverIcon}</div>` : '';
    const thumb = !d.cover && !d.coverIcon && (d.thumb || d.thumbIcon)
      ? `<div class="kit-thumb" style="${d.thumb ? `background-image:url('${kesc(d.thumb).replace(/'/g, '%27')}')` : ''}${d.thumbBg ? `;background-color:${d.thumbBg}` : ''}">${d.thumb ? '' : d.thumbIcon}</div>` : '';
    const acts = (d.acts || []).filter(a => a && (a.href || a.onclick));
    mask.firstElementChild.innerHTML = `<button class="kit-x" data-kit-close aria-label="关闭">✕</button>
      <div class="kit-scroll">${cover}
        <div class="kit-head">${thumb}<div class="kit-t"><h2>${kesc(d.title)}</h2>${d.sub ? `<div class="kit-sub">${d.sub}</div>` : ''}
          ${(d.tags || []).filter(Boolean).length ? `<div class="kit-tags">${d.tags.filter(Boolean).join('')}</div>` : ''}${d.big ? `<div class="kit-big">${d.big}</div>` : ''}</div></div>
        <div class="kit-body">${d.body || ''}</div></div>
      ${acts.length ? `<div class="kit-acts">${acts.map((a, i) => a.href
        ? `<a class="${a.pri || (i === 0 && acts.length < 3) ? 'pri' : ''}" href="${kesc(a.href)}" ${a.self ? '' : 'target="_blank" rel="noopener"'}>${a.text}</a>`
        : `<button class="${a.pri ? 'pri' : ''}" data-kit-act="${i}">${a.text}</button>`).join('')}</div>` : ''}`;
    acts.forEach((a, i) => { if (!a.href) { const b = mask.querySelector(`[data-kit-act="${i}"]`); if (b) b.onclick = a.onclick; } });
    mask.querySelector('.kit-scroll').scrollTop = 0;
    mask.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  // 打开详情：写进地址（可分享；浏览器返回 = 关闭）
  function open(key) {
    const target = '#/item/' + key;
    if (location.hash === target) return show(parse(target));
    ensure();
    if (parse()?.kind === 'item') history.replaceState(history.state, '', target);
    else { mask.dataset.base = location.hash; history.pushState({ kit: 1 }, '', target); }
    lastHash = target;
    show(parse(target));
  }
  function show(r) {
    const fn = items[r.type];
    const d = fn && fn(r.id, r.q);
    if (!d) { close(true); return false; }
    render(d);
    return true;
  }
  function close(silent) {
    if (!mask || !mask.classList.contains('open')) return;
    mask.classList.remove('open');
    document.body.style.overflow = '';
    if (!silent && parse()?.kind === 'item') {
      if (history.state && history.state.kit) history.back();          // 从页面里点开的：退回去
      else { history.replaceState(null, '', mask.dataset.base || location.pathname + location.search); lastHash = location.hash; }   // 直接打开的分享链接
    }
  }
  // 当前地址是列表页时渲染列表页并返回 true；首页时返回 false
  function route(box) {
    if (box) listBox = box;
    const r = parse();
    if (r && r.kind === 'list' && lists[r.type]) { lists[r.type](r.id, r.q, listBox); return true; }
    return false;
  }
  // 列表页的公共外壳：返回按钮 + 标题 + 子分类 + 排序
  function shell({ title, note, chips, sort, sortVal, body, more }) {
    return `<div class="kit-lhead"><button class="kit-back" data-kit-back title="返回">‹</button><h2>${kesc(title)}</h2>${note ? `<small>${note}</small>` : ''}</div>
      ${chips || sort ? `<div class="kit-lbar"><div class="kit-chips">${(chips || []).map(c => `<a class="${c.on ? 'on' : ''}" href="${kesc(c.href)}">${kesc(c.text)}${c.count != null ? `<small>${c.count}</small>` : ''}</a>`).join('')}</div>
        ${sort ? `<select class="kit-sel" data-kit-sort>${sort.map(([v, n]) => `<option value="${kesc(v)}" ${v === sortVal ? 'selected' : ''}>${kesc(n)}</option>`).join('')}</select>` : ''}</div>` : ''}
      ${body}${more ? `<button class="kit-more" data-kit-more>${more}</button>` : ''}`;
  }
  function init(home) {
    onHome = home;
    document.addEventListener('click', e => {
      const t = e.target.closest('[data-kit-item],[data-kit-go],[data-kit-back]');
      if (!t) return;
      const inner = e.target.closest('a[href],button,input,select,label,summary');   // 卡片里的其它按钮 / 链接（关注、复制…）优先
      if (inner && inner !== t && t.contains(inner)) return;
      e.preventDefault();
      if (t.dataset.kitBack !== undefined) { fromHome && history.length > fromHome ? history.go(-fromHome) : (location.hash = ''); return; }
      open(t.dataset.kitItem || t.dataset.kitGo);
    });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
    window.addEventListener('hashchange', () => {
      const r = parse();
      let was = parse(lastHash), steps = 1;
      if (was && was.kind === 'item') {                                 // 从详情离开
        const base = mask && mask.dataset.base !== undefined ? mask.dataset.base : '';
        if (location.hash === base) { lastHash = location.hash; close(true); return; }   // 只是关掉详情，底下页面不动
        was = parse(base); steps = 2;                                   // 在详情里点了别的列表：按详情底下那页算，返回要退两步
      }
      lastHash = location.hash;
      if (r && r.kind === 'item') { show(r); return; }
      close(true);
      const wasHome = !was;
      if (r && r.kind === 'list') {
        if (wasHome) { homeY = scrollY; fromHome = steps; }
        onHome && onHome();
        if (wasHome || was.type !== r.type) scrollTo(0, 0);
      } else {
        onHome && onHome();
        if (fromHome) { scrollTo(0, homeY); fromHome = 0; }
      }
    });
    // 直接打开带 #/item/ 的链接（比如大屏跳过来）：页面数据读完后由站点调用 KIT.boot()
  }
  function boot() { const r = parse(); if (r && r.kind === 'item') show(r); }
  return { item: (t, fn) => (items[t] = fn), list: (t, fn) => (lists[t] = fn), open, close, route, shell, init, boot, parse, esc: kesc,
    // 小工具：详情里的键值格、段落、关联列表
    kv: rows => { const r = rows.filter(x => x && x[1] != null && x[1] !== ''); return r.length ? `<div class="kit-kv">${r.map(([k, v]) => `<div><small>${kesc(k)}</small><b title="${kesc(v)}">${kesc(v)}</b></div>`).join('')}</div>` : ''; },
    sec: (title, html, note) => html ? `<div class="kit-sec"><h4>${title}${note ? `<small>${note}</small>` : ''}</h4>${html}</div>` : '',
    p: t => t ? `<p class="kit-p">${kesc(t)}</p>` : '',
  };
})();

(function () {
  var CAT = { A: '大模型 / AI 研究', B: 'AI 产品 / 工具', C: '开源社区', D: '开发技术', E: '行业动态' };
  var CAT_SHORT = { A: '大模型', B: 'AI 产品', C: '开源', D: '开发', E: '行业' };

  // 来源标识：缩写 + 品牌色
  var SRC = {
    '36氪':            ['36', '#1764ff'],
    'IT之家':          ['IT', '#d0021b'],
    '少数派':          ['π',  '#da282a'],
    '爱范儿':          ['ifr', '#f5b400'],
    '量子位':          ['QB', '#2a5bd7'],
    '极客公园':        ['GP', '#00a0e9'],
    '钛媒体':          ['Ti', '#1a1a1a'],
    '雷峰网':          ['雷', '#e8380d'],
    '开源中国':        ['OS', '#2fa44f'],
    'InfoQ':           ['iQ', '#0b8ed4'],
    'Hacker News':     ['Y',  '#ff6600'],
    'Dev.to':          ['DEV', '#3b49df'],
    'GitHub Trending': ['GH', '#30363d'],
    'arXiv':           ['ar', '#b31b1b'],
  };
  var CN_SOURCES = ['36氪','IT之家','少数派','爱范儿','量子位','极客公园','钛媒体','雷峰网','开源中国','InfoQ'];

  var allItems = [];
  var byId = {};                      // news_items.id → 条目（首页 + 分页 + 列表页 + 单条兜底）
  var hnHits = {}, hnFront = [];      // HN 实时热榜（objectID → hit）
  var state = { cat: 'ALL', srcs: new Set(), q: '', view: 'feed', limit: 40 };

  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function hashHue(s) { var h = 0; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360; return h; }
  function avatar(source) {
    var m = SRC[source];
    var txt = m ? m[0] : (source || '?').slice(0, 2);
    var bg = m ? m[1] : 'hsl(' + hashHue(source || '') + ',55%,45%)';
    if (source === 'AI 精选' || !source) bg = 'linear-gradient(120deg,#8b7cff,#4cc9f0)';
    return '<span class="avatar" style="background:' + bg + '">' + esc(txt) + '</span>';
  }
  function isAI(item) { return !item.type || item.type === 'ai'; }
  function timeAgo(item) {
    var t = item.created_at ? new Date(item.created_at) : null;
    if (!t || isNaN(t)) return item.date || '';
    var diff = (Date.now() - t.getTime()) / 1000;
    if (diff < 3600) return Math.max(1, Math.round(diff / 60)) + ' 分钟前';
    if (diff < 86400) return Math.round(diff / 3600) + ' 小时前';
    if (diff < 86400 * 7) return Math.round(diff / 86400) + ' 天前';
    return item.date || '';
  }
  function tagHTML(item) {
    var c = item.category || 'E';
    var html = '<span class="tag" style="color:var(--cat-' + esc(c) + ')">' + esc(CAT_SHORT[c] || c) + '</span>';
    if (isAI(item)) html += '<span class="tag tag-ai">✦ AI 精选</span>';
    return html;
  }
  // 抓取脚本把 HN 分数 / 评论、GitHub 星标 / 语言拼在摘要里（表里没有这些列），这里拆出来
  function parseStats(item) {
    var s = item.summary || '', o = { text: s };
    var m = s.match(/^▲ (\d+) 分 · (\d+) 条评论$/);
    if (m) { o.points = +m[1]; o.comments = +m[2]; o.text = ''; return o; }
    m = s.match(/^([\s\S]*?)\s*｜\s*(★ [^｜]*)$/);
    if (m) {
      o.text = m[1];
      m[2].split(' · ').forEach(function (p) {
        if (/^★ /.test(p)) o.stars = p.slice(2); else if (/^今日 \+/.test(p)) o.today = p.replace(/^今日 \+/, ''); else if (p) o.lang = p;
      });
    }
    return o;
  }
  // 展示用摘要：去掉统计后缀；与标题相同、「点击查看原文>」这类无效摘要不显示
  function summaryOf(item) { var t = parseStats(item).text; return t && t !== item.title && !/^\s*(点击)?(查看|阅读)(原文|全文|更多)/.test(t) ? t : ''; }
  function statsHTML(item) {
    var o = parseStats(item), a = [];
    if (o.points != null) a.push('▲ ' + o.points, o.comments + ' 评论');
    if (o.stars) a.push('★ ' + o.stars);
    if (o.lang) a.push(o.lang);
    return a.length ? '<span class="sep">·</span><span class="pts">' + esc(a.join(' · ')) + '</span>' : '';
  }
  function img(item, cls) {
    return item.image_url
      ? '<img class="' + cls + '" src="' + esc(item.image_url) + '" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">'
      : '';
  }

  // ── 三种视图 ─────────────────────────────────────────────
  function postHTML(item) {
    var sum = summaryOf(item);
    return '<article class="post" data-kit-item="news/' + item.id + '">' +
      avatar(item.source) +
      '<div class="post-body">' +
        '<div class="post-meta"><span class="src">' + esc(item.source) + '</span><span class="sep">·</span><span>' + esc(timeAgo(item)) + '</span>' + statsHTML(item) + tagHTML(item) + '</div>' +
        '<div class="post-title">' + esc(item.title) + '</div>' +
        (sum ? '<div class="post-summary">' + esc(sum) + '</div>' : '') +
        (item.url ? '<div class="post-actions">' +
          '<button class="act js-copy" data-url="' + esc(item.url) + '" data-title="' + esc(item.title) + '">⧉ 复制链接</button>' +
        '</div>' : '') +
      '</div>' +
      img(item, 'thumb') +
    '</article>';
  }
  function gcardHTML(item) {
    var sum = summaryOf(item);
    return '<article class="gcard" data-kit-item="news/' + item.id + '">' + img(item, '') +
      '<div class="in">' +
        '<div class="post-meta">' + avatar(item.source) + '<span class="src">' + esc(item.source) + '</span>' + tagHTML(item) + '</div>' +
        '<div class="post-title">' + esc(item.title) + '</div>' +
        (sum ? '<div class="post-summary">' + esc(sum) + '</div>' : '') +
        '<div class="post-meta" style="margin-top:auto">' + esc(timeAgo(item)) + statsHTML(item) + '</div>' +
      '</div></article>';
  }
  function rowHTML(item) {
    var sum = summaryOf(item), o = parseStats(item);
    var extra = o.points != null ? '▲ ' + o.points + ' · ' + o.comments + ' 评论' : o.stars ? '★ ' + o.stars : '';
    return '<div class="row" data-kit-item="news/' + item.id + '">' + avatar(item.source) +
      '<div class="row-main"><div class="row-title">' + esc(item.title) + '</div>' +
      '<div class="row-sub">' + esc(item.source) + (extra ? ' · ' + esc(extra) : '') + (sum ? ' · ' + esc(sum) : '') + '</div></div>' +
      tagHTML(item) + '</div>';
  }

  function renderFeed(items) {
    return '<div class="feed">' + items.map(postHTML).join('') + '</div>';
  }
  function renderGrid(items) {
    var withImg = items.filter(function (i) { return i.image_url; });
    var noImg = items.filter(function (i) { return !i.image_url; });
    var html = '';
    if (withImg.length) html += '<div class="section-label">📸 精选封面</div><div class="grid">' + withImg.map(gcardHTML).join('') + '</div>';
    if (noImg.length) html += '<div class="section-label' + (withImg.length ? ' gap' : '') + '">📰 全部资讯</div><div class="grid">' + noImg.map(gcardHTML).join('') + '</div>';
    return html;
  }
  function renderTimeline(items) {
    var groups = {}, order = [];
    items.forEach(function (it) {
      var d = it.date || '未知日期';
      if (!groups[d]) { groups[d] = []; order.push(d); }
      groups[d].push(it);
    });
    return order.map(function (d) {
      return '<div class="day"><div class="day-head">' + esc(d) + ' <span class="n">' + groups[d].length + ' 条</span></div>' +
        '<div class="rows">' + groups[d].map(rowHTML).join('') + '</div></div>';
    }).join('');
  }

  // ── 过滤 ────────────────────────────────────────────────
  function matchBase(it, ignore) {
    if (ignore !== 'cat' && state.cat !== 'ALL' && it.category !== state.cat) return false;
    if (ignore !== 'src' && state.srcs.size && !state.srcs.has(it.source)) return false;
    if (state.q) {
      var hay = (it.title + ' ' + (it.summary || '') + ' ' + it.source).toLowerCase();
      if (hay.indexOf(state.q) < 0) return false;
    }
    return true;
  }
  function filtered() { return allItems.filter(function (it) { return matchBase(it); }); }

  function renderNav() {
    var catBase = allItems.filter(function (it) { return matchBase(it, 'cat'); });
    var catCnt = { ALL: catBase.length };
    catBase.forEach(function (it) { catCnt[it.category] = (catCnt[it.category] || 0) + 1; });
    var cats = [['ALL', '全部', 'var(--grad)']].concat(Object.keys(CAT).map(function (k) { return [k, CAT[k], 'var(--cat-' + k + ')']; }));
    document.getElementById('js-cats').innerHTML = cats.map(function (c) {
      return '<button class="nav-item' + (state.cat === c[0] ? ' active' : '') + '" data-cat="' + c[0] + '">' +
        '<span class="cat-dot" style="background:' + c[2] + '"></span><span class="label">' + esc(c[1]) + '</span><span class="cnt">' + (catCnt[c[0]] || 0) + '</span></button>';
    }).join('');

    var srcBase = allItems.filter(function (it) { return matchBase(it, 'src'); });
    var srcCnt = {};
    srcBase.forEach(function (it) { srcCnt[it.source] = (srcCnt[it.source] || 0) + 1; });
    var srcs = Object.keys(srcCnt).sort(function (a, b) {
      var ca = CN_SOURCES.indexOf(a) >= 0, cb = CN_SOURCES.indexOf(b) >= 0;
      if (ca !== cb) return ca ? -1 : 1;
      return srcCnt[b] - srcCnt[a];
    });
    document.getElementById('js-srcs').innerHTML = srcs.map(function (s) {
      return '<button class="nav-item' + (state.srcs.has(s) ? ' active' : '') + '" data-src="' + esc(s) + '">' +
        avatar(s) + '<span class="label">' + esc(s) + '</span><span class="cnt">' + srcCnt[s] + '</span></button>';
    }).join('');
    document.getElementById('js-src-clear').hidden = !state.srcs.size;

    // 手机端横向标签：分类 + 来源
    document.getElementById('js-chips').innerHTML =
      cats.map(function (c) {
        return '<button class="chip' + (state.cat === c[0] ? ' active' : '') + '" data-cat="' + c[0] + '">' + esc(c[0] === 'ALL' ? '全部' : CAT_SHORT[c[0]]) + '</button>';
      }).join('') +
      srcs.map(function (s) {
        return '<button class="chip' + (state.srcs.has(s) ? ' active' : '') + '" data-src="' + esc(s) + '">' + esc(s) + '</button>';
      }).join('');
  }

  function render() {
    var r = KIT.parse();
    if (r && r.kind === 'list') { location.hash = ''; return; }   // 列表页上改了筛选 / 搜索：回首页再渲染
    var items = filtered();
    var shown = items.slice(0, state.limit);
    var countEl = document.getElementById('js-count');
    var filters = [];
    if (state.cat !== 'ALL') filters.push(CAT[state.cat]);
    if (state.srcs.size) filters.push(Array.from(state.srcs).join('、'));
    if (state.q) filters.push('“' + state.q + '”');
    countEl.textContent = items.length + ' 条资讯' + (filters.length ? ' · ' + filters.join(' · ') : ' · 国内外 ' + Object.keys(SRC).length + '+ 个来源');

    var html;
    if (!items.length) html = '<div class="empty">没有匹配的资讯，换个筛选试试</div>';
    else if (state.view === 'grid') html = renderGrid(shown);
    else if (state.view === 'timeline') html = renderTimeline(shown);
    else html = renderFeed(shown);
    if (items.length > shown.length) html += '<button class="more" id="js-more">加载更多（还有 ' + (items.length - shown.length) + ' 条）</button>';
    else if (!remoteDone) html += '<button class="more" id="js-more">' + (remoteBusy ? '加载中…' : '加载更早的资讯（已读 ' + allItems.length + ' 条）') + '</button>';
    document.getElementById('js-content').innerHTML = html;
    renderNav();
  }

  function renderRail() {
    // 国内热门：最近一次抓取的 36氪热榜
    var kr = allItems.filter(function (it) { return it.source === '36氪'; });
    if (kr.length) {
      var day = kr[0].date;
      kr = kr.filter(function (it) { return it.date === day; }).slice(0, 6);
      document.getElementById('js-cn').innerHTML = kr.map(function (it, i) {
        return '<a class="hot" href="#/item/news/' + it.id + '" data-kit-item="news/' + it.id + '"><span class="rk' + (i < 3 ? ' r' + (i + 1) : '') + '">' + (i + 1) + '</span><span class="t">' + esc(it.title) + '</span></a>';
      }).join('');
      document.getElementById('js-cn-widget').hidden = false;
    }
    // 来源分布：最新一天
    if (allItems.length) {
      var latest = allItems[0].date;
      var cnt = {};
      allItems.forEach(function (it) { if (it.date === latest) cnt[it.source] = (cnt[it.source] || 0) + 1; });
      var arr = Object.keys(cnt).map(function (k) { return [k, cnt[k]]; }).sort(function (a, b) { return b[1] - a[1]; });
      var max = arr.length ? arr[0][1] : 1;
      document.getElementById('js-stats').innerHTML = arr.map(function (a) {
        return '<div class="bar"><span class="nm">' + esc(a[0]) + '</span><span class="track"><span class="fill" style="display:block;width:' + Math.round(a[1] / max * 100) + '%"></span></span><span class="v">' + a[1] + '</span></div>';
      }).join('');
      document.getElementById('js-stat-day').textContent = latest;
      document.getElementById('js-stat-widget').hidden = false;
    }
  }

  // ── 交互 ────────────────────────────────────────────────
  function onNavClick(e) {
    var c = e.target.closest('[data-cat]');
    var s = e.target.closest('[data-src]');
    if (c) state.cat = c.dataset.cat;
    else if (s) { var v = s.dataset.src; state.srcs.has(v) ? state.srcs.delete(v) : state.srcs.add(v); }
    else return;
    state.limit = 40;
    render();
  }
  document.querySelector('.side').addEventListener('click', onNavClick);
  document.getElementById('js-chips').addEventListener('click', onNavClick);
  document.getElementById('js-src-clear').addEventListener('click', function (e) {
    e.stopPropagation(); state.srcs.clear(); render();
  });
  document.getElementById('js-view').addEventListener('click', function (e) {
    var b = e.target.closest('[data-view]'); if (!b) return;
    state.view = b.dataset.view;
    document.querySelectorAll('#js-view button').forEach(function (x) { x.classList.toggle('active', x === b); });
    try { localStorage.setItem('tp-view', state.view); } catch (err) {}
    render();
  });
  document.getElementById('js-content').addEventListener('click', function (e) {
    if (e.target.id === 'js-more') {
      state.limit += 40;
      if (filtered().length < state.limit) loadMoreRemote();   // 已读的 400 条用完，继续向 Supabase 分页拉
      render(); return;
    }
    var cp = e.target.closest('.js-copy');
    if (cp && navigator.clipboard) {
      navigator.clipboard.writeText(cp.dataset.title + ' ' + cp.dataset.url).then(function () {
        cp.textContent = '✓ 已复制'; setTimeout(function () { cp.textContent = '⧉ 复制链接'; }, 1400);
      });
    }
  });
  var searchEl = document.getElementById('js-search');
  var timer;
  searchEl.addEventListener('input', function () {
    clearTimeout(timer);
    timer = setTimeout(function () { state.q = searchEl.value.trim().toLowerCase(); state.limit = 40; render(); }, 120);
  });
  if (!/Mac|iPhone|iPad/.test(navigator.platform)) document.getElementById('js-kbd').textContent = 'Ctrl K';
  document.addEventListener('keydown', function (e) {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); searchEl.focus(); searchEl.select(); }
    if (e.key === 'Escape' && document.activeElement === searchEl) { searchEl.value = ''; searchEl.dispatchEvent(new Event('input')); searchEl.blur(); }
  });

  // 主题：默认跟随系统，手动切换后记住
  var root = document.documentElement;
  function applyTheme(t) { if (t === 'light') root.setAttribute('data-theme', 'light'); else root.removeAttribute('data-theme'); }
  var saved = null;
  try { saved = localStorage.getItem('tp-theme'); } catch (err) {}
  applyTheme(saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'));
  document.getElementById('js-theme').addEventListener('click', function () {
    var next = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    applyTheme(next);
    try { localStorage.setItem('tp-theme', next); } catch (err) {}
  });
  try {
    var v = localStorage.getItem('tp-view');
    if (v && /^(feed|timeline|grid)$/.test(v)) {
      state.view = v;
      document.querySelectorAll('#js-view button').forEach(function (x) { x.classList.toggle('active', x.dataset.view === v); });
    }
  } catch (err) {}

  // ── HN 实时热榜 ─────────────────────────────────────────
  // 刷新时失败保留已有内容，只有首次加载失败才替换为报错
  function loadHN(isRefresh) {
    return fetch('https://hn.algolia.com/api/v1/search?tags=front_page&hitsPerPage=30', { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        var hits = (data.hits || []).filter(function (h) { return h.title; });
        hnFront = hits;
        hits.forEach(function (h) { hnHits[h.objectID] = h; });
        var r = KIT.parse();
        if (r && r.kind === 'list' && r.type === 'hn') page();   // 正停在 HN 列表页：数据到了再渲染一次
        hits = hits.slice(0, 8);
        if (!hits.length) { if (!isRefresh) document.getElementById('js-hn-widget').hidden = true; return; }
        document.getElementById('js-hn-widget').hidden = false;
        document.getElementById('js-hn').innerHTML = hits.map(function (h, i) {
          var pts = h.points ? (h.points >= 1000 ? (h.points / 1000).toFixed(1) + 'k' : h.points) : '';
          return '<a class="hot" href="#/item/hn/' + esc(h.objectID) + '" data-kit-item="hn/' + esc(h.objectID) + '"><span class="rk' + (i < 3 ? ' r' + (i + 1) : '') + '">' + (i + 1) + '</span>' +
            '<span class="t">' + esc(h.title) + '</span>' +
            (pts ? '<span class="pts">▲ ' + pts + '</span>' : '') + '</a>';
        }).join('');
      })
      .catch(function () { if (!isRefresh) document.getElementById('js-hn-widget').hidden = true; });
  }

  // ── 详情（右侧抽屉）与列表页 ─────────────────────────────
  // 地址：#/item/news/<news_items.id>、#/item/hn/<HN objectID>；列表 #/list/hn、#/list/src/<来源>、#/list/cat/<A-E>
  var missing = {}, pending = {};
  function fmtTime(iso) {
    var t = iso ? new Date(iso) : null;
    if (!t || isNaN(t)) return '';
    var p = function (n) { return (n < 10 ? '0' : '') + n; };
    return t.getFullYear() + '-' + p(t.getMonth() + 1) + '-' + p(t.getDate()) + ' ' + p(t.getHours()) + ':' + p(t.getMinutes());
  }
  function host(url) { try { return new URL(url).hostname.replace(/^www\./, ''); } catch (err) { return ''; } }
  function srcIcon(source) {
    var m = SRC[source];
    return '<span style="color:#fff;font-weight:800;font-size:18px">' + esc(m ? m[0] : (source || '?').slice(0, 2)) + '</span>';
  }
  function srcBg(source) { var m = SRC[source]; return m ? m[1] : 'hsl(' + hashHue(source || '') + ',55%,45%)'; }
  function ktag(t) { return t ? '<span>' + esc(t) + '</span>' : ''; }
  function relRows(list) {
    return list.length ? '<div class="kit-rows">' + list.map(function (x) {
      return '<div class="kit-row" data-kit-go="news/' + x.id + '"><span class="kit-rt">' + esc(x.title) + '</span><span class="kit-rm">' + esc(x.source) + ' · ' + esc(timeAgo(x)) + '</span></div>';
    }).join('') + '</div>' : '';
  }
  // 直接打开的分享链接，条目可能不在已读的 400 条里：按 id 单独查一次
  function reshow(type, id) { var r = KIT.parse(); if (r && r.kind === 'item' && r.type === type && r.id === String(id)) KIT.boot(); }
  function fetchOne(id) {
    if (pending[id]) return;
    pending[id] = 1;
    sb('select=*&id=eq.' + id).then(function (r) { return r.json(); })
      .then(function (rows) { if (Array.isArray(rows) && rows[0]) cleanRows(rows); else missing[id] = 1; })
      .catch(function () { missing[id] = 1; })
      .then(function () { reshow('news', id); });
  }
  function copyAct(title, url) {
    return { text: '⧉ 复制链接', onclick: function () {
      var b = this;
      if (navigator.clipboard) navigator.clipboard.writeText(title + ' ' + url).then(function () { b.textContent = '✓ 已复制'; });
    } };
  }

  KIT.item('news', function (id) {
    if (!/^\d+$/.test(id)) return null;
    var it = byId[id];
    if (!it) {
      if (missing[id]) return { title: '没有找到这条资讯', sub: '可能已被清理，或链接有误', thumbIcon: '⚠️' };
      fetchOne(id);
      return { title: '加载中…', thumbIcon: '⏳' };
    }
    var c = it.category || 'E', o = parseStats(it), sum = summaryOf(it);
    var sameSrc = allItems.filter(function (x) { return x !== it && x.source === it.source; }).slice(0, 6);
    var sameCat = allItems.filter(function (x) { return x !== it && x.category === c && x.source !== it.source; }).slice(0, 6);
    var big = o.points != null ? '<b>▲ ' + o.points + '</b><span>分</span><b>' + o.comments + '</b><span>条评论</span>'
      : o.stars ? '<b>★ ' + esc(o.stars) + '</b><span>星标</span>' + (o.today ? '<b>+' + esc(o.today) + '</b><span>今日新增</span>' : '') : '';
    var acts = [];
    if (it.url && it.url !== '#') acts.push({ text: '阅读原文 ↗', href: it.url }, copyAct(it.title, it.url));
    return {
      title: it.title, sub: esc(it.source) + ' · ' + esc(timeAgo(it)),
      cover: it.image_url || '', thumbIcon: srcIcon(it.source), thumbBg: srcBg(it.source),
      tags: [ktag(CAT_SHORT[c] || c), isAI(it) ? ktag('✦ AI 精选') : '', o.lang ? ktag(o.lang) : ''],
      big: big,
      body: (sum ? KIT.sec('摘要', KIT.p(sum)) : '')
        + KIT.sec('信息', KIT.kv([['来源', it.source], ['分类', CAT[c] || c], ['日期', it.date], ['收录时间', fmtTime(it.created_at)],
            ['语言', o.lang || ''], ['网站', host(it.url)]]))
        + (sum ? '' : KIT.sec('说明', KIT.p('这条只抓到了标题，正文请点下方「阅读原文」。')))
        + KIT.sec('同来源 · ' + esc(it.source), relRows(sameSrc), '<a class="kit-morelink" href="#/list/src/' + encodeURIComponent(it.source) + '">全部 →</a>')
        + KIT.sec('同分类 · ' + esc(CAT_SHORT[c] || c), relRows(sameCat), '<a class="kit-morelink" href="#/list/cat/' + c + '">全部 →</a>'),
      acts: acts
    };
  });

  // HN 实时热榜条目（不在数据库里，来自 Algolia）
  function fetchHN(id) {
    if (pending['hn' + id]) return;
    pending['hn' + id] = 1;
    fetch('https://hn.algolia.com/api/v1/search?tags=story_' + encodeURIComponent(id), { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (d) { var h = (d.hits || [])[0]; if (h) hnHits[id] = h; else missing['hn' + id] = 1; })
      .catch(function () { missing['hn' + id] = 1; })
      .then(function () { reshow('hn', id); });
  }
  KIT.item('hn', function (id) {
    if (!/^\d+$/.test(id)) return null;
    var h = hnHits[id];
    if (!h) {
      if (missing['hn' + id]) return { title: '没有找到这条 HN 帖子', thumbIcon: '⚠️' };
      fetchHN(id);
      return { title: '加载中…', thumbIcon: '⏳' };
    }
    var disc = 'https://news.ycombinator.com/item?id=' + h.objectID;
    var rank = hnFront.indexOf(h);
    var others = hnFront.filter(function (x) { return x !== h; }).slice(0, 8);
    var text = h.story_text ? h.story_text.replace(/<p>/g, '\n').replace(/<[^>]+>/g, '').replace(/&#x27;/g, "'").replace(/&quot;/g, '"').replace(/&gt;/g, '>').replace(/&lt;/g, '<').replace(/&amp;/g, '&') : '';
    return {
      title: h.title, sub: 'Hacker News · ' + esc(h.author || '') + ' · ' + esc(fmtTime(h.created_at)),
      thumbIcon: srcIcon('Hacker News'), thumbBg: srcBg('Hacker News'),
      tags: [rank >= 0 ? ktag('首页第 ' + (rank + 1) + ' 名') : '', ktag(host(h.url))],
      big: '<b>▲ ' + (h.points || 0) + '</b><span>分</span><b>' + (h.num_comments || 0) + '</b><span>条评论</span>',
      body: (text ? KIT.sec('正文', KIT.p(text)) : '')
        + KIT.sec('信息', KIT.kv([['作者', h.author], ['分数', h.points], ['评论', h.num_comments], ['发布时间', fmtTime(h.created_at)], ['网站', host(h.url)]]))
        + KIT.sec('HN 首页其它热帖', others.length ? '<div class="kit-rows">' + others.map(function (x) {
            return '<div class="kit-row" data-kit-go="hn/' + esc(x.objectID) + '"><span class="kit-rt">' + esc(x.title) + '</span><span class="kit-rm">▲ ' + (x.points || 0) + ' · ' + (x.num_comments || 0) + ' 评论</span></div>';
          }).join('') + '</div>' : '', '<a class="kit-morelink" href="#/list/hn">全部 →</a>'),
      acts: [h.url ? { text: '阅读原文 ↗', href: h.url } : null, { text: 'HN 讨论 ↗', href: disc }]
    };
  });

  // 列表页：主内容区换成列表，返回时回到首页原位置
  var LP = 30, listN = LP, lists = {};
  var listBox = document.getElementById('js-list');
  function page() {
    var isList = KIT.route(listBox);
    listBox.hidden = !isList;
    ['.toolbar', '#js-chips', '#js-content'].forEach(function (sel) { document.querySelector(sel).style.display = isList ? 'none' : ''; });
    if (!isList) render();
  }
  // 按条件向 Supabase 分页拉（offset + limit），每个列表各自缓存
  function remoteList(key, filter) {
    var L = lists[key] || (lists[key] = { rows: [], total: null, done: false, busy: false });
    if (!L.busy && !L.done && L.rows.length < listN) {
      L.busy = true;
      sb('select=*&' + filter + '&order=date.desc,created_at.desc&offset=' + L.rows.length + '&limit=' + (listN - L.rows.length), { 'Prefer': 'count=exact' })
        .then(function (r) {
          var cr = (r.headers.get('content-range') || '').split('/')[1];
          if (cr && cr !== '*') L.total = +cr;
          return r.json();
        })
        .then(function (rows) {
          if (!Array.isArray(rows)) throw new Error('bad response');
          L.rows = L.rows.concat(cleanRows(rows));
          if (L.total != null ? L.rows.length >= L.total : !rows.length) L.done = true;
        })
        .catch(function () { L.done = true; L.err = true; })
        .then(function () { L.busy = false; var r = KIT.parse(); if (r && r.kind === 'list') page(); });
    }
    return L;
  }
  function listBody(L) {
    var shown = L.rows.slice(0, listN);
    return {
      body: shown.length ? '<div class="rows">' + shown.map(rowHTML).join('') + '</div>'
        : '<div class="empty">' + (L.busy ? '加载中…' : L.err ? '⚠️ 加载失败，请稍后重试' : '暂无') + '</div>',
      more: shown.length && (L.rows.length > listN || !L.done) ? (L.busy ? '加载中…' : '加载更多（' + shown.length + (L.total != null ? ' / ' + L.total : '') + '）') : ''
    };
  }
  KIT.list('src', function (src, q, box) {
    var L = remoteList('src:' + src, 'source=eq.' + encodeURIComponent(src)), b = listBody(L);
    var names = Object.keys(SRC);
    if (names.indexOf(src) < 0) names.push(src);
    box.innerHTML = KIT.shell({ title: src, note: (L.total != null ? L.total + ' 条 · ' : '') + '按收录时间倒序',
      chips: names.map(function (s) { return { text: s, href: '#/list/src/' + encodeURIComponent(s), on: s === src }; }),
      body: b.body, more: b.more });
  });
  KIT.list('cat', function (c, q, box) {
    if (!CAT[c]) c = 'A';
    var L = remoteList('cat:' + c, 'category=eq.' + c), b = listBody(L);
    box.innerHTML = KIT.shell({ title: CAT[c], note: (L.total != null ? L.total + ' 条 · ' : '') + '按收录时间倒序',
      chips: Object.keys(CAT).map(function (k) { return { text: CAT_SHORT[k], href: '#/list/cat/' + k, on: k === c }; }),
      body: b.body, more: b.more });
  });
  // HN 首页实时热榜（Algolia，首页约 30 条）
  var HN_SORT = [['rank', '首页排序'], ['points', '分数最高'], ['comments', '评论最多'], ['new', '最新发布']];
  var hnSort = 'rank';
  KIT.list('hn', function (_, q, box) {
    var arr = hnFront.slice();
    if (hnSort === 'points') arr.sort(function (a, b) { return (b.points || 0) - (a.points || 0); });
    if (hnSort === 'comments') arr.sort(function (a, b) { return (b.num_comments || 0) - (a.num_comments || 0); });
    if (hnSort === 'new') arr.sort(function (a, b) { return (b.created_at_i || 0) - (a.created_at_i || 0); });
    var shown = arr.slice(0, listN);
    box.innerHTML = KIT.shell({ title: 'Hacker News 热榜', note: arr.length + ' 条 · 实时',
      chips: [{ text: '当前首页', href: '#/list/hn', on: true }, { text: '站内收录', href: '#/list/src/' + encodeURIComponent('Hacker News') }],
      sort: HN_SORT, sortVal: hnSort,
      body: shown.length ? '<div class="widget">' + shown.map(function (h) {
          var i = hnFront.indexOf(h);
          return '<a class="hot" href="#/item/hn/' + esc(h.objectID) + '" data-kit-item="hn/' + esc(h.objectID) + '"><span class="rk' + (i < 3 ? ' r' + (i + 1) : '') + '">' + (i + 1) + '</span>' +
            '<span class="t">' + esc(h.title) + (host(h.url) ? ' <small style="color:var(--text-3)">(' + esc(host(h.url)) + ')</small>' : '') + '</span>' +
            '<span class="pts">▲ ' + (h.points || 0) + ' · ' + (h.num_comments || 0) + ' 评论</span></a>';
        }).join('') + '<div class="widget-foot"></div></div>' : '<div class="empty">加载中…</div>',
      more: arr.length > listN ? '加载更多（' + listN + ' / ' + arr.length + '）' : '' });
  });
  document.addEventListener('change', function (e) {
    if (e.target.matches('[data-kit-sort]')) { hnSort = e.target.value; page(); }
  });
  document.addEventListener('click', function (e) { if (e.target.closest('[data-kit-more]')) { listN += LP; page(); } });
  window.addEventListener('hashchange', function () {
    var r = KIT.parse();
    if (!r || r.kind !== 'item') listN = LP;
  }, true);

  // ── 数据 ────────────────────────────────────────────────
  var SUPABASE_URL = 'https://sqrzrvstlvxqxdxvhlxz.supabase.co';
  var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNxcnpydnN0bHZ4cXhkeHZobHh6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMTUzMjAsImV4cCI6MjA5NjU5MTMyMH0.C6Gz61TB3GhLnbDWywogGZDcqTu1G2ta9-Dyo60Yiho';

  var PAGE = 400;          // 首页一次读 400 条，之后按 offset 继续分页
  var remoteDone = false, remoteBusy = false;
  function sb(query, headers) {
    var h = { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY };
    for (var k in headers || {}) h[k] = headers[k];
    return fetch(SUPABASE_URL + '/rest/v1/news_items?' + query, { headers: h, cache: 'no-store' });
  }
  // 旧 arXiv 摘要带 "arXiv:xxx Announce Type: new Abstract:" 前缀，展示时去掉；同时记进 id 索引
  function cleanRows(rows) {
    rows.forEach(function (it) {
      if (it.summary) it.summary = it.summary.replace(/^\s*arXiv:\S+\s+Announce Type:\s*\S+\s*Abstract:\s*/, '');
      byId[it.id] = it;
    });
    return rows;
  }
  function loadMoreRemote() {
    if (remoteBusy || remoteDone) return;
    remoteBusy = true;
    sb('select=*&order=date.desc,created_at.desc&offset=' + allItems.length + '&limit=' + PAGE)
      .then(function (r) { return r.json(); })
      .then(function (rows) {
        if (!Array.isArray(rows)) throw new Error('bad response');
        if (rows.length < PAGE) remoteDone = true;
        var have = {};
        allItems.forEach(function (it) { have[it.id] = 1; });
        allItems = allItems.concat(cleanRows(rows).filter(function (it) { return !have[it.id]; }));
      })
      .catch(function () {})
      .then(function () { remoteBusy = false; var r = KIT.parse(); if (!r || r.kind === 'item') render(); });
  }

  function loadNews(isRefresh) {
    return sb('select=*&order=date.desc,created_at.desc&limit=' + PAGE)
      .then(function (r) { return r.json(); })
      .then(function (rows) {
        if (!Array.isArray(rows)) throw new Error('bad response');
        allItems = cleanRows(rows);
        remoteDone = rows.length < PAGE;
        var d = allItems.length ? allItems[0].date : '';
        document.getElementById('js-updated').textContent = d;
        document.getElementById('js-footer-updated').textContent = d ? '数据更新于 ' + d : '';
        page();
        renderRail();
        return true;
      })
      .catch(function () {
        if (!isRefresh) document.getElementById('js-content').innerHTML = '<div class="empty">⚠️ 数据加载失败<br><small>请检查网络或 Supabase 配置</small></div>';
        return false;
      });
  }

  KIT.init(page);
  loadHN(false);
  loadNews(false).then(function (ok) { if (ok) KIT.boot(); });

  // ── 手动刷新 ────────────────────────────────────────────
  var refreshBtn = document.getElementById('js-refresh');
  refreshBtn.addEventListener('click', function () {
    if (refreshBtn.disabled) return;
    refreshBtn.disabled = true;
    refreshBtn.classList.add('spinning');
    Promise.all([loadHN(true), loadNews(true)]).then(function (res) {
      refreshBtn.disabled = false;
      refreshBtn.classList.remove('spinning');
      refreshBtn.title = res[1] ? '重新加载数据' : '刷新失败，请稍后重试';
    });
  });
}());
</script>
</body>
</html>
