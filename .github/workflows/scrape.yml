name: Daily News Scraper

on:
  schedule:
    - cron: '0 1 * * *'  # 01:00 UTC = 09:00 北京时间
  workflow_dispatch:       # 支持手动触发
  push:
    branches: [main]
    paths: ['scraper.py', '.github/workflows/scrape.yml']

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run scraper
        run: python scraper.py
      - name: Commit last_scrape.txt
        run: |
          TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S' > last_scrape.txt
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last_scrape.txt
          git diff --cached --quiet || git commit -m "chore: scrape heartbeat $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
          git push
